<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>반품 정책 · 문서 검토</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #21332e;
      --muted: #586963;
      --page: #f3f5f1;
      --paper: #fff;
      --line: #d6dfd7;
      --accent: #226047;
      --accent-hover: #194a36;
      --soft: #edf4ee;
      --warning: #775420;
      --warning-soft: #fbf3e4;
    }
    * { box-sizing: border-box; }
    html { scrollbar-gutter: stable; }
    body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.6 system-ui, sans-serif; }
    button, textarea { font: inherit; }
    button { cursor: pointer; border: 1px solid var(--line); border-radius: 7px; padding: 11px 17px; background: var(--paper); color: var(--ink); font-weight: 600; line-height: 1.4; }
    button:hover:enabled { background: var(--soft); border-color: var(--accent); }
    button:disabled { cursor: default; opacity: .5; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .shell { max-width: 1080px; margin: 0 auto; padding: 54px 32px 40px; }
    .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(32px, 5vw, 44px); line-height: 1.2; letter-spacing: -.035em; }
    .subtitle { color: var(--muted); margin: 12px 0 32px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 24px; align-items: start; }
    .document, .review { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; }
    .document { min-width: 0; overflow: hidden; }
    .document-head { padding: 22px 28px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: center; }
    .meta { margin: 0; font-size: 14px; color: var(--muted); }
    .revision { margin: 0 0 3px; font-size: 15px; font-weight: 650; }
    .edit-button { font-size: 14px; padding: 8px 12px; white-space: nowrap; }
    .action-slot { display: grid; align-items: center; justify-content: end; margin-top: 14px; }
    .action-slot > * { grid-area: 1 / 1; }
    .action-slot > [hidden] { display: flex !important; visibility: hidden; pointer-events: none; }
    .action-slot > .edit-button { justify-self: end; }
    .document-body { padding: 24px 28px 28px; }
    .content-frame { position: relative; }
    .document-copy, textarea { margin: 0; border: 1px solid transparent; padding: 12px; font: 21px/1.8 Georgia, serif; white-space: pre-wrap; overflow-wrap: anywhere; }
    .document-copy { min-height: 100px; }
    .content-frame:has(#editor:not([hidden])) .document-copy { visibility: hidden; }
    #editor { position: absolute; inset: 0; }
    .review { padding: 25px 24px; }
    .review h2 { font-size: 18px; margin: 0 0 18px; }
    .status { display: inline-block; margin: 0; padding: 5px 10px; border-radius: 5px; background: var(--warning-soft); color: var(--warning); font-size: 13px; font-weight: 650; }
    .status[data-state="approved"] { background: var(--soft); color: var(--accent); }
    .status[data-state="changes"] { background: var(--warning-soft); color: var(--warning); }
    .decision-context { margin: 15px 0 22px; color: var(--muted); font-size: 14px; }
    .actions { display: grid; gap: 10px; }
    .primary { background: var(--accent); color: var(--paper); border-color: var(--accent); }
    .primary:hover:enabled { background: var(--accent-hover); color: var(--paper); }
    .consequence { margin: 0 0 22px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    .history { margin: 20px 2px 0; color: var(--muted); font-size: 13px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    textarea { display: block; width: 100%; height: 100%; resize: none; overflow: auto; color: var(--ink); background: var(--paper); border-color: var(--muted); border-radius: 6px; }
    .edit-feedback { display: grid; margin-top: 10px; font-size: 13px; }
    .edit-help, .error { grid-area: 1 / 1; margin: 0; }
    .edit-help { color: var(--muted); }
    .edit-feedback:has(.error:not([hidden])) .edit-help { visibility: hidden; }
    .edit-actions { display: flex; gap: 8px; }
    .edit-actions button { font-size: 13px; padding: 8px 10px; white-space: nowrap; }
    .error { color: var(--warning); }
    [hidden] { display: none !important; }
    @media (max-width: 760px) {
      .shell { padding: 30px 18px; }
      .subtitle { margin-bottom: 24px; }
      .layout { grid-template-columns: minmax(0, 1fr); gap: 18px; }
      .document-head { padding: 19px 20px; }
      .document-body { padding: 20px; }
      .document-copy, textarea { font-size: 20px; }
      .review { padding: 22px 20px; }
    }
    @media (prefers-reduced-motion: no-preference) { button { transition: background .15s, border-color .15s; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">문서 검토</p>
      <h1>반품 정책</h1>
      <p class="subtitle">문서 내용을 확인하고 검토 결과를 남겨주세요.</p>
    </header>
    <div class="layout">
      <article class="document" aria-label="문서 내용">
        <header class="document-head">
          <div>
            <p class="revision" id="revision-heading" tabindex="-1">버전 <span id="revision">1</span></p>
            <p class="meta">작성자: 김서연</p>
          </div>
        </header>
        <div class="document-body">
          <div class="content-frame">
            <p class="document-copy" id="document-content">구매 증빙이 있는 미사용 제품은 구매일로부터 30일 이내에 반품할 수 있습니다.</p>
            <form id="editor" hidden novalidate>
              <label class="visually-hidden" for="content">문서 내용</label>
              <textarea id="content" aria-describedby="edit-help" required></textarea>
            </form>
          </div>
          <div class="edit-feedback">
            <p class="edit-help" id="edit-help">수정한 내용을 저장하면 새 버전이 생성되며 다시 검토해야 합니다.</p>
            <p class="error" id="content-error" role="alert" hidden>저장할 문서 내용을 입력해주세요.</p>
          </div>
          <div class="action-slot">
            <button class="edit-button" id="edit" type="button">문서 수정</button>
            <div class="edit-actions" id="edit-actions" hidden>
              <button class="primary" type="submit" form="editor" id="save">새 버전 저장</button>
              <button type="button" id="cancel">수정 취소</button>
            </div>
          </div>
        </div>
      </article>
      <section class="review" aria-labelledby="review-heading">
        <h2 id="review-heading">검토 결과</h2>
        <p class="status" id="status" role="status" aria-live="polite" tabindex="-1">검토 대기 · 버전 1</p>
        <p class="decision-context" id="decision-context">버전 1의 내용을 확인한 뒤 검토 결과를 선택해주세요.</p>
        <p class="consequence" id="consequence">승인은 현재 저장된 버전 1에만 적용됩니다. 이후 수정된 내용은 새로 검토해야 합니다.</p>
        <div class="actions">
          <button class="primary" id="approve" type="button" aria-describedby="consequence">버전 1 승인</button>
          <button id="changes" type="button">수정 요청</button>
        </div>
      </section>
    </div>
    <p class="history" id="history" hidden></p>
  </main>
  <script>
    const elements = Object.fromEntries(
      ['revision', 'revision-heading', 'document-content', 'edit', 'edit-actions', 'editor', 'content', 'content-error', 'save', 'cancel', 'status', 'decision-context', 'approve', 'changes', 'consequence', 'history']
        .map(id => [id, document.getElementById(id)])
    );
    const revisions = [{ number: 1, content: elements['document-content'].textContent, decision: 'pending' }];
    let editing = false;
    const current = () => revisions[revisions.length - 1];

    function render() {
      const revision = current();
      elements.revision.textContent = revision.number;
      elements['document-content'].textContent = revision.content;
      elements.editor.hidden = !editing;
      elements.edit.hidden = editing;
      elements['edit-actions'].hidden = !editing;
      elements.approve.disabled = editing || revision.decision !== 'pending';
      elements.changes.disabled = editing || revision.decision !== 'pending';
      elements.approve.textContent = `버전 ${revision.number} 승인`;
      elements.consequence.textContent = `승인은 현재 저장된 버전 ${revision.number}에만 적용됩니다. 이후 수정된 내용은 새로 검토해야 합니다.`;
      const status = revision.decision === 'approved' ? '승인됨' : revision.decision === 'changes' ? '수정 요청됨' : '검토 대기';
      elements.status.textContent = `${status} · 버전 ${revision.number}`;
      elements.status.dataset.state = revision.decision;
      elements['decision-context'].textContent = revision.decision === 'approved'
          ? `버전 ${revision.number}이 승인되었습니다. 문서를 수정하면 검토 대기 상태의 새 버전이 생성됩니다.`
          : revision.decision === 'changes'
            ? `버전 ${revision.number}에 수정이 요청되었습니다. 내용을 수정하고 새 버전을 저장해주세요.`
            : `버전 ${revision.number}의 내용을 확인한 뒤 검토 결과를 선택해주세요.`;
      const previousDecision = revisions.slice(0, -1).findLast(item => item.decision !== 'pending');
      elements.history.hidden = !previousDecision;
      if (previousDecision) {
        elements.history.textContent = `이전 검토: 버전 ${previousDecision.number} ${previousDecision.decision === 'approved' ? '승인됨' : '수정 요청됨'}. 이전 결과는 해당 버전에만 적용됩니다.`;
      }
    }

    elements.edit.addEventListener('click', () => {
      editing = true;
      elements.content.value = current().content;
      elements['content-error'].hidden = true;
      elements.content.removeAttribute('aria-invalid');
      elements.content.setAttribute('aria-describedby', 'edit-help');
      render();
      elements.content.focus({ preventScroll: true });
    });

    elements.editor.addEventListener('submit', event => {
      event.preventDefault();
      const content = elements.content.value;
      if (!content.trim()) {
        elements['content-error'].hidden = false;
        elements.content.setAttribute('aria-invalid', 'true');
        elements.content.setAttribute('aria-describedby', 'edit-help content-error');
        elements.content.focus({ preventScroll: true });
        return;
      }
      if (content !== current().content) {
        revisions.push({ number: current().number + 1, content, decision: 'pending' });
      }
      editing = false;
      render();
      elements['content-error'].hidden = true;
      elements.content.removeAttribute('aria-invalid');
      elements['revision-heading'].focus({ preventScroll: true });
    });

    elements.cancel.addEventListener('click', () => {
      editing = false;
      elements['content-error'].hidden = true;
      elements.content.removeAttribute('aria-invalid');
      render();
      elements.edit.focus({ preventScroll: true });
    });

    elements.content.addEventListener('input', () => {
      if (elements.content.value.trim()) {
        elements['content-error'].hidden = true;
        elements.content.removeAttribute('aria-invalid');
        elements.content.setAttribute('aria-describedby', 'edit-help');
      }
    });

    function recordDecision(decision) {
      if (editing || current().decision !== 'pending') return;
      current().decision = decision;
      render();
      elements.status.focus({ preventScroll: true });
    }
    elements.approve.addEventListener('click', () => recordDecision('approved'));
    elements.changes.addEventListener('click', () => recordDecision('changes'));
  </script>
</body>
</html>
