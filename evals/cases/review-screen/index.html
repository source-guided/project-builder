<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review draft</title>
<style>
body { font: 16px system-ui; margin: 24px; color: #19212b; background: #f5f6f8; }
.stats { display: flex; gap: 20px; min-width: 950px; }
.card { padding: 30px; background: white; border: 1px solid #ccd0d5; }
textarea { width: 900px; height: 160px; }
button { padding: 12px; margin: 8px; }
</style>
<h1>Workspace dashboard</h1>
<div class="stats"><div class="card">47 documents</div><div class="card">12 team members</div><div class="card">API v0.3</div><div class="card">Memory 18 MB</div></div>
<p>Implementation status: prototype database integration pending.</p>
<p>Welcome to the advanced workflow intelligence platform. Explore all collaboration possibilities.</p>
<h2>Return policy</h2><p>Author: Morgan · Revision <span id="revision">1</span></p>
<textarea id="content">Return unused items within 30 days with proof of purchase.</textarea>
<p id="status">Awaiting review</p>
<button id="approve">Approve</button><button id="changes">Request changes</button><button id="save">Save edit</button>
<script>
let revision = 1;
document.querySelector('#approve').onclick = () => { document.querySelector('#status').textContent = 'Approved'; };
document.querySelector('#changes').onclick = () => { document.querySelector('#status').textContent = 'Changes requested'; };
document.querySelector('#save').onclick = () => { document.querySelector('#revision').textContent = ++revision; };
</script>
</html>
